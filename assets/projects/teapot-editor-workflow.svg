<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">3D editor PropertyGrid workflow illustration</title>
  <desc id="desc">An illustrated teapot viewport beside editable transformation and diffuse texture properties, with selection, editing, and saving steps.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f6f0"/><stop offset="1" stop-color="#e9ede4"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#e0e9e5"/><stop offset=".48" stop-color="#8faaa9"/><stop offset="1" stop-color="#4c686b"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#e1e6db" stroke-width="1"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4c625a" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1200" height="720" fill="url(#back)"/>
  <text x="62" y="61" fill="#5f715f" font-family="monospace" font-size="16" letter-spacing="3">MONOGAME / WINDOWS FORMS</text>
  <text x="62" y="107" fill="#23332f" font-family="Arial, sans-serif" font-weight="700" font-size="37">3D model editor</text>
  <text x="1140" y="62" text-anchor="end" fill="#63766d" font-family="monospace" font-size="15">WORKFLOW ILLUSTRATION · NOT A SCREENSHOT</text>
  <g filter="url(#shadow)">
    <rect x="60" y="140" width="755" height="460" rx="15" fill="#fbfcf7" stroke="#c5d1c6" stroke-width="2"/>
    <rect x="60" y="140" width="755" height="48" rx="15" fill="#e3e9e0"/>
    <path d="M60 173h755v15H60z" fill="#e3e9e0"/>
    <circle cx="86" cy="164" r="6" fill="#d9aa8f"/><circle cx="107" cy="164" r="6" fill="#e6c974"/><circle cx="128" cy="164" r="6" fill="#9cba95"/>
    <text x="163" y="169" fill="#65786b" font-family="monospace" font-size="13">SCENE VIEW · TEAPOT SELECTED</text>
    <rect x="80" y="205" width="715" height="371" rx="7" fill="#edf0e9"/>
    <rect x="80" y="205" width="715" height="371" rx="7" fill="url(#grid)"/>
    <path d="M80 492Q430 448 795 487V576H80Z" fill="#dce5dd"/>
    <ellipse cx="437" cy="483" rx="195" ry="29" fill="#9bb0a1" opacity=".27"/>
    <g stroke="#3d6264" stroke-width="6" stroke-linejoin="round" fill="url(#metal)">
      <path d="M305 343 Q319 285 380 279 H461 Q540 284 556 343 L531 427 Q501 463 430 470 Q353 461 329 423Z"/>
      <path d="M530 333 Q604 320 654 331 Q643 354 575 374 L548 386Z"/>
      <path d="M322 338 Q241 301 239 370 Q240 429 330 423 L333 392 Q274 416 270 369 Q270 330 329 366Z"/>
      <path d="M343 292 Q434 258 523 291 L515 307 Q434 289 351 307Z"/>
      <path d="M393 276 Q403 250 429 249 Q453 250 463 276Z"/>
      <path d="M376 468H489L514 485H353Z"/>
    </g>
    <ellipse cx="433" cy="359" rx="99" ry="57" fill="#f8fffb" opacity=".2"/>
    <path d="M421 412h33M437 396v32" stroke="#fff" stroke-width="3" opacity=".9"/>
    <path d="M459 405h73" stroke="#d68f67" stroke-width="3"/><path d="M457 405l-7-5v10z" fill="#d68f67"/>
    <text x="100" y="557" fill="#718476" font-family="monospace" font-size="12">SELECT MODEL  →  DRAG / ROTATE  →  EDIT PROPERTIES</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="841" y="140" width="300" height="460" rx="15" fill="#fdfdf9" stroke="#c5d1c6" stroke-width="2"/>
    <rect x="841" y="140" width="300" height="48" rx="15" fill="#e3e9e0"/>
    <path d="M841 173h300v15H841z" fill="#e3e9e0"/>
    <text x="865" y="169" fill="#596f60" font-family="monospace" font-size="14">PROPERTY GRID</text>
    <text x="865" y="222" fill="#687d6c" font-family="monospace" font-size="12">APPEARANCE</text>
    <rect x="859" y="235" width="264" height="49" rx="6" fill="#f0f3ed"/>
    <text x="875" y="264" fill="#40554d" font-family="Arial,sans-serif" font-size="16">DiffuseTexture</text>
    <text x="1107" y="264" text-anchor="end" fill="#3c706c" font-family="Arial,sans-serif" font-size="16" font-weight="700">Metal ▾</text>
    <text x="865" y="320" fill="#687d6c" font-family="monospace" font-size="12">TRANSFORMATION</text>
    <rect x="859" y="334" width="264" height="166" rx="6" fill="#f0f3ed"/>
    <text x="875" y="366" fill="#40554d" font-family="Arial,sans-serif" font-size="16">Position</text>
    <text x="1107" y="366" text-anchor="end" fill="#3c706c" font-family="monospace" font-size="14">X  0 · Y  0 · Z  0</text>
    <path d="M871 382h240" stroke="#d6dfd4"/>
    <text x="875" y="414" fill="#40554d" font-family="Arial,sans-serif" font-size="16">Rotation</text>
    <text x="1107" y="414" text-anchor="end" fill="#3c706c" font-family="monospace" font-size="14">X  0 · Y  0 · Z  0</text>
    <path d="M871 431h240" stroke="#d6dfd4"/>
    <text x="875" y="467" fill="#40554d" font-family="Arial,sans-serif" font-size="16">Scale</text>
    <text x="1107" y="467" text-anchor="end" fill="#3c706c" font-family="monospace" font-size="14">15</text>
    <rect x="860" y="525" width="263" height="45" rx="7" fill="#eacb67"/>
    <text x="991" y="553" text-anchor="middle" fill="#293a31" font-family="Arial,sans-serif" font-weight="700" font-size="16">Save / reopen scene</text>
  </g>
  <text x="61" y="654" fill="#486053" font-family="Arial,sans-serif" font-size="18" font-weight="700">Artist-facing controls, live state synchronization, persistent edits.</text>
  <text x="61" y="687" fill="#829488" font-family="monospace" font-size="12">Visual summary of the implemented workflow; actual application media to follow.</text>
</svg>
